# tmux-claude.conf - tmux configuration for Claude monitoring
# Created: 2025-08-07
#
# Add this to your ~/.tmux.conf:
#   source-file ~/.tmux/plugins/tmux-claude-ext/conf/tmux-claude.conf

# ============================================================================
# Configuration Options
# ============================================================================

# Enable/disable Claude monitoring (on/off)
set-option -g @claude-monitor on

# Timeout before showing ⏱ marker (seconds)
set-option -g @claude-timeout 300

# Enable bell notifications (on/off)
set-option -g @claude-bell on

# Display style (symbols/colors/both)
set-option -g @claude-style symbols

# Notification method (bell/flash/system/none)
set-option -g @claude-notify bell

# Custom symbols (optional - defaults shown)
set-option -g @claude-symbol-choice "❓"
set-option -g @claude-symbol-timeout "⏱"
set-option -g @claude-symbol-error "❌"
set-option -g @claude-symbol-complete "✅"
set-option -g @claude-symbol-thinking "🤔"
set-option -g @claude-symbol-active "🔄"

# ============================================================================
# Window Status Format
# ============================================================================

# Window status format with Claude indicators (simplified)
set-window-option -g window-status-format '#I:#W#{@claude_#{window_index}_status}'
set-window-option -g window-status-current-format '#[bold]#I:#W#{@claude_#{window_index}_status}#[default]'

# Alternative format with colors
# set-window-option -g window-status-format '#I:#W#{?@claude_#{window_index}_status,#[fg=yellow]#{@claude_#{window_index}_status}#[default],}'
# set-window-option -g window-status-current-format '#[bold]#I:#W#{?@claude_#{window_index}_status,#[fg=yellow,bold]#{@claude_#{window_index}_status}#[default],}#[default]'

# ============================================================================
# Status Line
# ============================================================================

# Status line with Claude alert counter
set -g status-right-length 100
set -g status-right '#{?@claude_alerts,#[fg=yellow][Claude: #{@claude_alerts}]#[default] ,}%H:%M %d-%b-%y'

# Alternative minimal status
# set -g status-right '#{?@claude_alerts,⚠️ #{@claude_alerts} ,}%H:%M'

# ============================================================================
# Hooks
# ============================================================================

# Auto-start monitoring on new session
set-hook -g after-new-session 'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-monitor start"'

# Monitor new windows and panes
set-hook -g after-new-window 'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-hook window-add"'
set-hook -g after-new-pane 'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-hook pane-add"'

# Clean up on pane exit
set-hook -g pane-exited 'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-hook pane-exited"'

# ============================================================================
# Key Bindings
# ============================================================================

# Prefix + C-c: Show Claude status
bind-key C-c run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-ctl status"

# Prefix + M-c: Clear current pane alert
bind-key M-c run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-ctl clear"

# Prefix + C-n: Go to next alert
bind-key C-n run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-ctl goto"

# Prefix + C-m: Mute/unmute monitoring
bind-key C-m if-shell '[ "$(tmux show-option -gqv @claude-monitor)" = "on" ]' \
    'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-ctl mute"' \
    'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-ctl unmute"'

# ============================================================================
# Colors and Styles (optional)
# ============================================================================

# Highlight windows with alerts (when using color style)
# set-window-option -g window-status-activity-style 'fg=yellow,bold'
# set-window-option -g window-status-bell-style 'fg=red,bold'

# ============================================================================
# Advanced Options (optional)
# ============================================================================

# Monitor specific processes (regex pattern)
# set-option -g @claude-process-pattern "claude|claude-code|ai-assistant"

# Custom log directory (default: /tmp/tmux-claude)
# set-option -g @claude-log-dir "$HOME/.tmux/claude-logs"

# Debug mode (verbose logging)
# set-option -g @claude-debug off

# ============================================================================
# Initialization
# ============================================================================

# Start monitor if enabled
if-shell '[ "$(tmux show-option -gqv @claude-monitor)" = "on" ]' \
    'run-shell "~/.tmux/plugins/tmux-claude-ext/bin/tmux-claude-monitor start"'